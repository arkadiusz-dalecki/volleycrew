root /app/frontend;
include /etc/nginx/volleycrew-security.conf;
location /api/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $vc_scheme;
    proxy_set_header X-Volleycrew-Base $vc_base;
    proxy_set_header X-Ingress-Path "";
    proxy_set_header X-Remote-User-Id "";
    proxy_set_header X-Remote-User-Name "";
    proxy_set_header X-Remote-User-Display-Name "";
    proxy_read_timeout 60s;
    proxy_send_timeout 30s;
}
location /assets/ {
    try_files $uri =404;
    expires 1y;
}
location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/volleycrew-security.conf;
    add_header Cache-Control no-store;
    sub_filter '<base href="/"' '<base href="$vc_base/"';
    sub_filter_once on;
}
